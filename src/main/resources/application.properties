spring.application.name=plan
server.port=4002

# Configuración local (credenciales de la base y del mail, secreto del JWT): archivo .env, que no se sube a git.
# Copiar .env.example como .env y completarlo.
spring.config.import=optional:file:.env[.properties]

# Base de datos MySQL (se crea sola si no existe; Hibernate crea y actualiza las tablas al arrancar)
spring.datasource.url=jdbc:mysql://localhost:3306/etrip_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

# Errores: el mensaje propio de cada excepción llega al front; nunca el stacktrace
server.error.include-stacktrace=never
server.error.include-message=always

# Fotos de las experiencias (hasta 5 por experiencia)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=40MB

# JWT: el secreto (en .env) firma los tokens; duran 24 h
application.security.jwt.secretKey=${JWT_SECRET}
application.security.jwt.expiration=86400000

# Orígenes del front habilitados por CORS (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Mails (verificación del email, recuperar contraseña y regalos) con Gmail y una contraseña de aplicación.
# Si MAIL_USERNAME queda vacío, el asunto de cada mail (con el código) se escribe en la consola del back.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
