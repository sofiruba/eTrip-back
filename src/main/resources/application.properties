application.security.jwt.expiration: 86400000
# Orígenes del front habilitados por CORS (separados por coma). Al desplegar, sumar la URL de Vercel con CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
# Solo desarrollo: /forgot-password devuelve el código (no hay mail). Poner en false al entregar.
app.password-reset.show-code=true
