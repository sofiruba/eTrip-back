spring.application.name=demo
server.port=4002
spring.datasource.url=jdbc:mysql://localhost:3306/etrip_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:hola1234}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.error.include-stacktrace=never
server.error.include-message=always
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=40MB
application.security.jwt.secretKey: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration: 86400000
# Orígenes del front habilitados por CORS (separados por coma). Al desplegar, sumar la URL de Vercel con CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
# Mails (verificar el email al registrarse y recuperar la contraseña) con Gmail y una contraseña de aplicación.
# Las credenciales NO van acá: se leen del archivo .env (ignorado por git, ver .env.example).
# Si MAIL_USERNAME queda vacío, los códigos se escriben en la consola del back.
spring.config.import=optional:file:.env[.properties]
# Dirección del front: los mails la usan para los links (ej. el regalo → Mis reservas)
app.front-url=${FRONT_URL:http://localhost:5173}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
